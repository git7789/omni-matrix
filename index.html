<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bowen | Creative Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="boot-screen">
        <div id="falling-zero">0</div>
        <div id="shockwave"></div>
        <div id="explosion-line"></div>
    </div>

    <div id="ui-overlay">
        <h1 id="brand-logo">BOWEN</h1>
        <button id="return-btn" class="hud-btn">RETURN TO ORBIT</button>
    </div>

    <div id="sidebar-menu">
        <div class="menu-item active" data-index="0">ABOUT</div>
        <div class="menu-item" data-index="1">SKILLS</div>
        <div class="menu-item" data-index="2">EXPERIENCE</div>
        <div class="menu-item" data-index="3">PROJECTS</div>
        <div class="menu-item" data-index="4">VISION</div>
        <div class="menu-item" data-index="5">CONTACT</div>
    </div>

    <div id="page-terminal">
        <h2 id="page-title">SYSTEM INITIATED</h2>
        <p id="page-text">Awaiting navigational input...</p>
    </div>

    <div id="hologram-ui">
        <p style="color: #ff0055; font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 5px;">[ SYSTEM ACCESS GRANTED ]</p>
        <h3 id="holo-title">PROJECT</h3>
        <p id="holo-desc">Description loading...</p>
        <p id="holo-stack">STACK</p>
        <a id="holo-link" href="#" target="_blank">ACCESS DATA</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
